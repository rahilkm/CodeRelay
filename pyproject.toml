[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coderelay"
version = "0.1.0"
description = "Local Windows application orchestrating AI coding agents with seamless handoff"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
coderelay = "coderelay.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["coderelay*"]
